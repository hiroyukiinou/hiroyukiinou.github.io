<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f3f0e8">
  <meta name="description" content="オフラインで使える音取り用キーボード">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <title>音取りキーボード</title>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div><p class="eyebrow">OFFLINE PITCH KEYBOARD</p><h1>音取りキーボード</h1></div>
      <div class="status"><span id="audioStatus" class="dot"></span><span id="statusText">タップして音を有効にする</span></div>
    </header>
    <section class="controls" aria-label="音の設定">
      <label class="control"><span>音律</span><select id="temperament"><option value="equal">平均律</option><option value="just">純正律</option></select></label>
      <label class="control"><span>主音</span><select id="tonic"></select></label>
      <label class="control"><span>調</span><select id="mode"><option value="major">長調</option><option value="minor">短調</option></select></label>
      <label class="control"><span>基準ピッチ A4</span><select id="reference"><option value="440">440 Hz</option><option value="442">442 Hz</option><option value="415">415 Hz（バロック）</option><option value="custom">任意</option></select></label>
      <label class="control custom-ref" id="customWrap" hidden><span>任意のHz</span><input id="customHz" type="number" min="300" max="500" step="0.1" value="440"></label>
      <div class="control transpose"><span>トランスポーズ</span><div class="stepper"><button id="transDown" aria-label="半音下げる">−</button><output id="transValue">0</output><button id="transUp" aria-label="半音上げる">＋</button><button id="transReset" class="reset">戻す</button></div></div>
      <div class="control octave"><span>鍵域</span><div class="stepper"><button id="octDown" aria-label="1オクターブ下げる">−</button><output id="octValue">C3–B4</output><button id="octUp" aria-label="1オクターブ上げる">＋</button></div></div>
      <label class="control volume"><span>音量</span><input id="volume" type="range" min="0" max="1" step="0.01" value="0.35"></label>
      <button id="sustain" class="sustain" aria-pressed="false"><span class="pedal-icon">◖</span><span>サスティン</span><strong>OFF</strong></button>
    </section>
    <section class="keyboard-area" aria-label="演奏用鍵盤">
      <div class="keyboard-row"><div class="row-label" id="rowLabel1"></div><div class="keys" id="keys1"></div></div>
      <div class="keyboard-row"><div class="row-label" id="rowLabel2"></div><div class="keys" id="keys2"></div></div>
    </section>
    <footer class="footer">
      <div class="note-readout"><span class="readout-label">発音中</span><strong id="notesNow">—</strong></div>
      <div class="computer-help"><span class="keycap">A W S E D F T G Y H U J K</span><span>Mac キーボード：白鍵＋上段の黒鍵 ／ Z・Xでオクターブ移動</span></div>
      <button id="stopAll" class="stop-button">音を止める</button>
    </footer>
    <p class="fineprint">純正律は選択した主音を基準に音階を作ります。臨時記号の音程は試作段階の近似です。</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
